services:
  - type: web
    name: fantasy-game-server
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: SPRING_PROFILE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SCHEDULING_ENABLED
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://fantasy-draft-sigma.vercel.app
      - key: WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
        value: https://fantasy-draft-sigma.vercel.app
