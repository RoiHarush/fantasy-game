# ====== Neon PostgreSQL Database ======
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# ====== JPA / Hibernate (Specific for PostgreSQL) ======
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=${DB_DDL_ACTION:none}
spring.jpa.show-sql=false

# Database changes are explicit and versioned in db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.root=info

# Season/gameweek automation is on by default; initial-draft scheduling is independent.
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
