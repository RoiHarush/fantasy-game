# ====== Neon PostgreSQL Database ======
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# ====== JPA / Hibernate (Specific for PostgreSQL) ======
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=${DB_DDL_ACTION:none}
spring.jpa.show-sql=false

# Database changes are explicit and versioned in db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.root=info

# Authentication is served over HTTPS in production.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# Season/gameweek and initial-draft automation share one operational switch.
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
