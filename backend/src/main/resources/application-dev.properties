# application-dev.properties

# ====== H2 Console ======
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====== Database (Persistent Local File) ======
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:file:./data/fantasydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
# Existing local databases were previously maintained by Hibernate through V4.
# A fresh local database still runs the complete V0-V5 chain.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

logging.level.com.fantasy=DEBUG

# Local development only. Production must provide JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ZmFudGFzeS1kZXYtb25seS1zaWduaW5nLWtleS0zMi1ieXRlcw==}

# Prevent local historical data from being advanced merely by starting the app.
# Initial-draft scheduling remains active and is safe to test locally.
app.scheduling.enabled=${SCHEDULING_ENABLED:false}
