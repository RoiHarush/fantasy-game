spring.profiles.active=${SPRING_PROFILE:dev}
spring.application.name=fantasy-backend

# Port
server.port=${PORT:8080}

# Render and other orchestrators use this endpoint to route traffic only to a
# process that has started successfully and can reach its database.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Authentication. Production intentionally fails to start when JWT_SECRET is absent.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}
# The production deployment must set AUTH_COOKIE_SECURE=true because it runs behind HTTPS.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Transactional email. Local development logs the complete action link instead
# of contacting an external provider. Production uses Resend through its API.
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.from=${MAIL_FROM:Fantasy Draft <no-reply@example.com>}
app.mail.resend.api-key=${RESEND_API_KEY:}
# AI is intentionally opt-in. With no key the feature uses a deterministic local fallback.
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:groq}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
# Both product surfaces are separately gated. Production can leave them off
# while local development exercises the complete deterministic fallback.
app.ai.coach-enabled=${AI_COACH_ENABLED:false}
app.ai.roast-enabled=${AI_ROAST_ENABLED:false}
app.ai.daily-analysis-limit=${AI_DAILY_ANALYSIS_LIMIT:5}
app.ai.followup-limit=${AI_FOLLOWUP_LIMIT:10}
app.ai.roast-rotation-seconds=${AI_ROAST_ROTATION_SECONDS:30}
# Standards-based PWA Web Push. Leaving the keys empty disables push delivery
# without affecting WebSocket updates or in-app toasts.
app.web-push.vapid.public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:}
app.web-push.vapid.private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:}
app.web-push.vapid.subject=${WEB_PUSH_VAPID_SUBJECT:mailto:admin@example.com}
# One switch controls every scheduled mutation, including initial-draft countdowns.
app.scheduling.enabled=${SCHEDULING_ENABLED:false}
# Keeps consecutive server-driven waiver turns readable in every live client.
# The transfer remains atomic; only the start of the next automatic turn is paced.
app.transfer.automatic-turn-delay=${AUTOMATIC_TURN_DELAY:2s}
# Live FPL bootstrap is explicit. Normal application restarts never seed data.
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
# A season reset is destructive and requires both flags plus disabled scheduling.
app.season-reset.enabled=${SEASON_RESET_ENABLED:false}
app.season-reset.confirmation=${SEASON_RESET_CONFIRMATION:}
# Browser API calls are same-origin and reach Spring through the Next.js rewrite.
# WebSocket/SockJS handshakes keep their own explicit browser-origin validation.
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.*.*:3000,https://fantasy-draft-sigma.vercel.app,https://*.ngrok-free.dev,https://*.trycloudflare.com}

# Per-user API guardrails. These deliberately generous token buckets prevent
# accidental request loops and button spam without touching WebSocket traffic.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.read-capacity=${RATE_LIMIT_READ_CAPACITY:600}
app.rate-limit.write-capacity=${RATE_LIMIT_WRITE_CAPACITY:120}
app.rate-limit.auth-capacity=${RATE_LIMIT_AUTH_CAPACITY:30}
app.rate-limit.window=${RATE_LIMIT_WINDOW:60s}

# Hikari
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off
logging.level.org.hibernate=warn
logging.level.org.hibernate.type=off
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
