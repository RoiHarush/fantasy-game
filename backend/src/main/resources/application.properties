spring.profiles.active=${SPRING_PROFILE:dev}

# Port
server.port=${PORT:8080}

# Render and other orchestrators use this endpoint to route traffic only to a
# process that has started successfully and can reach its database.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Authentication. Production intentionally fails to start when JWT_SECRET is absent.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}
app.waivers.offline-grace-seconds=${WAIVER_OFFLINE_GRACE_SECONDS:30}
app.waivers.poll-millis=${WAIVER_POLL_MILLIS:5000}
# Controls season/gameweek automation. Initial-draft countdowns stay enabled in every profile.
app.scheduling.enabled=${SCHEDULING_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://fantasy-draft-sigma.vercel.app}
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,https://fantasy-draft-sigma.vercel.app,https://*.ngrok-free.dev,https://*.trycloudflare.com}

# Hikari
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off
logging.level.org.hibernate=warn
logging.level.org.hibernate.type=off
